# Publishes @banou/fkn-3p-auth to npm via OIDC Trusted Publishing with no stored npm token.
#
# THE FILENAME IS PART OF THE TRUST RELATIONSHIP AND MUST NOT CHANGE. npm trusted publishing binds
# the package to repository + workflow filename, both case-sensitive (banou26/fkn-3p-auth +
# publish.yaml on npmjs.com).
name: Publish

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    outputs:
      changed: ${{ steps.decide.outputs.changed }}
      version: ${{ steps.decide.outputs.version }}
      held: ${{ steps.publish.outputs.held }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # NO registry-url on purpose: that writes an .npmrc pinning auth to ${NODE_AUTH_TOKEN}, which is
      # empty here and causes npm to skip the OIDC exchange. No cache when install is conditional.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@12.2.2
          echo "npm $(npm --version)"

      - name: Decide whether the version moved
        id: decide
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          DOC=$(node -p "encodeURIComponent(require('./package.json').name)")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "doc=$DOC" >> "$GITHUB_OUTPUT"
          if OUT=$(node scripts/npm-version-gate.mjs "$NAME" "$VERSION" 2> "$RUNNER_TEMP/gate.err"); then
            echo "::notice::$(cat "$RUNNER_TEMP/gate.err")"
            echo "$OUT" >> "$GITHUB_OUTPUT"
          else
            echo "::error::$(cat "$RUNNER_TEMP/gate.err")"
            exit 1
          fi

      - name: Install dependencies
        if: steps.decide.outputs.changed == 'true'
        run: npm ci

      - name: Verify checks and build tarball
        if: steps.decide.outputs.changed == 'true'
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run prepack

      - name: Verify artifact before publish
        if: steps.decide.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          node << 'EOF'
            const { strict: assert } = require("node:assert")
            const { execFileSync } = require("node:child_process")
            const { existsSync, mkdirSync, mkdtempSync, readFileSync, rmSync, writeFileSync } = require("node:fs")
            const { join } = require("node:path")

            const manifest = JSON.parse(readFileSync("package.json", "utf8"))
            assert.equal(manifest.name, "@banou/fkn-3p-auth")
            assert.equal(manifest.version, process.env.VERSION)
            assert.equal(manifest.main, "./build/index.js")
            assert.equal(manifest.types, "./build/index.d.ts")

            const walk = (value) => {
              if (typeof value === "string") {
                assert.ok(!value.startsWith("./") || existsSync(value), `missing export target: ${value}`)
                return
              }
              if (value && typeof value === "object") Object.values(value).forEach(walk)
            }
            walk(manifest.exports)

            const expectedRepo = `https://github.com/${process.env.GITHUB_REPOSITORY}`
            const declaredRepo = (manifest.repository?.url ?? manifest.repository ?? "").replace(/^git\+/, "").replace(/\.git$/, "")
            assert.equal(declaredRepo, expectedRepo, `repository ${declaredRepo || "unset"} does not match ${expectedRepo}`)

            const deps = { ...manifest.dependencies, ...manifest.peerDependencies }
            const local = Object.entries(deps).filter(([, range]) => /^(file:|link:|portal:)/.test(range))
            assert.equal(local.length, 0, `unpublishable local dependencies: ${local.map(([n, r]) => `${n}@${r}`).join(", ")}`)

            const packRaw = JSON.parse(execFileSync("npm", ["pack", "--dry-run", "--json", "--ignore-scripts"], { encoding: "utf8" }))
            const packReport = Array.isArray(packRaw) ? packRaw[0] : Object.values(packRaw ?? {})[0]
            assert.ok(Array.isArray(packReport?.files), "npm pack --dry-run --json gave no file list")
            const files = packReport.files.map((entry) => entry.path)
            for (const required of ["LICENSE", "README.md", "package.json", "build/index.js", "build/index.d.ts", "build/google.js", "build/google.d.ts"]) {
              assert.ok(files.includes(required), `missing required tarball file: ${required}`)
            }
            const runtimeLibImport = /(?:from\s+|import\s*\(\s*|require\s*\(\s*)["']@fkn\/lib(?:\/|["'])/
            for (const file of files) {
              assert.ok(!file.startsWith("src/") && !file.startsWith("tests/") && !file.startsWith("scripts/"), `unexpected source file in tarball: ${file}`)
              if (file.endsWith(".js")) {
                const contents = readFileSync(file, "utf8")
                assert.ok(!runtimeLibImport.test(contents), `unexpected @fkn/lib runtime import in ${file}`)
              }
            }

            const work = mkdtempSync(join(process.env.RUNNER_TEMP || "/tmp", "fkn-3p-auth-check-"))
            try {
              const packDir = join(work, "pack")
              const appDir = join(work, "app")
              mkdirSync(packDir)
              mkdirSync(appDir)
              execFileSync("npm", ["pack", "--ignore-scripts", "--pack-destination", packDir], { stdio: "inherit" })
              const tgz = execFileSync("sh", ["-c", `ls "${packDir}"/*.tgz`], { encoding: "utf8" }).trim()
              writeFileSync(join(appDir, "package.json"), JSON.stringify({ name: "consumer", private: true, type: "module" }))
              execFileSync("npm", ["install", "--no-save", "--ignore-scripts", tgz], { cwd: appDir, stdio: "inherit" })
              execFileSync("node", ["--input-type=module", "-e", "await import('@banou/fkn-3p-auth'); await import('@banou/fkn-3p-auth/google');"], { cwd: appDir, stdio: "inherit" })
            } finally {
              rmSync(work, { recursive: true, force: true })
            }
            console.log(`artifact ok: ${manifest.name}@${manifest.version} (${files.length} files)`)
          EOF

      - name: Publish
        id: publish
        if: steps.decide.outputs.changed == 'true'
        env:
          NPM_CONFIG_LOGLEVEL: verbose
          NAME: ${{ steps.decide.outputs.name }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set +e
          npm publish --ignore-scripts --access public 2>&1 | tee "$RUNNER_TEMP/publish.log"
          CODE=${PIPESTATUS[0]}
          set -e
          if [ "$CODE" != "0" ] && grep -qF "Cannot publish over previously staged version \"$VERSION\"" "$RUNNER_TEMP/publish.log"; then
            echo "::notice::npm already holds $NAME $VERSION as staged from an earlier run; skipping confirm wait"
            echo "held=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$CODE"

      - name: Confirm the registry serves it
        if: steps.decide.outputs.changed == 'true' && steps.publish.outputs.held != 'true'
        env:
          NAME: ${{ steps.decide.outputs.name }}
          VERSION: ${{ steps.decide.outputs.version }}
          DOC: ${{ steps.decide.outputs.doc }}
        run: |
          for attempt in $(seq 1 120); do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/$DOC/$VERSION")
            if [ "$CODE" = "200" ]; then
              echo "::notice::the registry serves $NAME $VERSION"
              exit 0
            fi
            echo "attempt $attempt: the registry answered $CODE"
            sleep 15
          done
          echo "::error::the registry still does not serve $NAME $VERSION"
          exit 1

  tag:
    needs: publish
    if: needs.publish.outputs.changed == 'true' && needs.publish.outputs.held != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Tag the published commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::notice::tag v$VERSION already exists; skipping"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$GITHUB_SHA"
